[package]
name = "baby_cmplog"
version = "0.14.1"
authors = ["Dongjia Zhang <tokazerkje@outlook.jp>"]
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
debug = true

[dependencies]
env_logger = "0.11.7"
libafl = { path = "../../../crates/libafl", features = ["remove_me"] }
libafl_bolts = { path = "../../../crates/libafl_bolts" }
libafl_core = { path = "../../../crates/libafl_core" }
libafl_targets = { path = "../../../crates/libafl_targets" }
clap = { version = "4.5.18", features = ["derive"] }
