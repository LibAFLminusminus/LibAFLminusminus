[package]
name = "baby_inprocess"
version = "0.14.1"
authors = ["Romain Malmain <rmalmain@pm.me>"]
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
debug = true

[dependencies]
libaflmm = { path = "../../../crates/libaflmm" }
libaflmm_bolts = { path = "../../../crates/libaflmm_bolts" }

env_logger = "0.11.7"
