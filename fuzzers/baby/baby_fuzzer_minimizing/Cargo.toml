[package]
name = "baby_fuzzer_minimizing"
version = "0.16.0"
authors = [
  "Andrea Fioraldi <andreafioraldi@gmail.com>",
  "Dominik Maier <domenukk@gmail.com>",
  "Addison Crump <research@addisoncrump.info>",
]
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
debug = true

[dependencies]
libaflmm = { path = "../../../crates/libaflmm", features = ["prelude"] }
libaflmm_bolts = { path = "../../../crates/libaflmm_bolts", features = [
  "prelude",
] }
log = { version = "0.4.22", features = ["release_max_level_info"] }
