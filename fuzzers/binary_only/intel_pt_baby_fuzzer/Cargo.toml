[package]
name = "intel_pt_baby_fuzzer"
version = "0.16.0"
authors = [
  "Andrea Fioraldi <andreafioraldi@gmail.com>",
  "Dominik Maier <domenukk@gmail.com>",
  "Marco Cavenati <cavenatimarco@gmail.com>",
]
edition = "2024"

[dependencies]
libaflmm = { path = "../../../crates/libaflmm" }
libaflmm_bolts = { path = "../../../crates/libaflmm_bolts" }
libaflmm_intelpt = { path = "../../../crates/libaflmm_intelpt" }
proc-maps = "0.5.0"

env_logger = "0.11.7"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
debug = true
