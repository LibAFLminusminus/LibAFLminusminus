[package]
name = "frida_fuzzer"
version = "0.16.0"
authors = [
  "Andrea Fioraldi <andreafioraldi@gmail.com>",
  "Dominik Maier <domenukk@gmail.com>",
]
edition = "2024"

[features]
default = ["std"]
std = []

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true
panic = 'abort'

[dependencies]
libaflmm = { path = "../../../crates/libaflmm", features = [
  "errors_backtrace",
  "web_monitor",
] }
libaflmm_bolts = { path = "../../../crates/libaflmm_bolts" }
frida-gum = { version = "0.17.0", features = [
  "auto-download",
  "event-sink",
  "invocation-listener",
  "script",
] }
libaflmm_frida = { path = "../../../crates/libaflmm_frida", features = [
  "cmplog",
] }
libaflmm_targets = { path = "../../../crates/libaflmm_targets", features = [
  "sancov_cmplog",
] }
libloading = "0.9.0"
log = { version = "0.4.22", features = ["release_max_level_trace"] }
mimalloc = { version = "0.1.43", default-features = true, features = [
  "local_dynamic_tls",
] }
color-backtrace = { version = "0.7.4", features = ["resolve-modules"] }
env_logger = "0.11.5"
