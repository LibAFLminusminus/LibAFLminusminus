[package]
name = "qemu_baremetal"
version = "0.16.0"
authors = [
  "Andrea Fioraldi <andreafioraldi@gmail.com>",
  "Dominik Maier <domenukk@gmail.com>",
  "Romain Malmain <rmalmain@pm.me>",
]
edition = "2021"

[features]
default = ["std", "low_level", "arm"]
std = []

arm = ["libaflmm_qemu/arm"]
i386 = ["libaflmm_qemu/i386"]

low_level = [
] # The low-level way to interact with LibAFL QEMU, with direct calls to QEMU's functions
breakpoint = [] # Uses the command system, with breakpoints
custom_insn = [] # Uses the command system, with custom instructions.

shared = ["libaflmm_qemu/shared"]

[profile.release]
incremental = true
debug = true
lto = "fat"
codegen-units = 1

[dependencies]
libaflmm = { path = "../../../crates/libaflmm" }
libaflmm_bolts = { path = "../../../crates/libaflmm_bolts" }
libaflmm_targets = { path = "../../../crates/libaflmm_targets" }
libaflmm_qemu = { path = "../../../crates/libaflmm_qemu", features = [
  "systemmode",
], default-features = false }

env_logger = "0.11.5"
log = { version = "0.4.22", features = ["release_max_level_info"] }

[build-dependencies]
libaflmm_qemu_build = { path = "../../../crates/libaflmm_qemu/libaflmm_qemu_build" }
