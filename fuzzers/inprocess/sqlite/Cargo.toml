[package]
name = "sqlite"
version = "0.16.0"
authors = [
  "Romain Malmain <romain.malmain@pm.me>",
  "Dongjia Zhang <tokazerkje@outlook.com>",
]
edition = "2024"

[features]
default = ["std"]
std = []

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true

[build-dependencies]
cc = { version = "1.1.21", features = ["parallel"] }
which = "8.0.5"

[dependencies]
# no llmp compression for now, better perfs.
libaflmm = { path = "../../../crates/libaflmm", default-features = false, features = [
  "derive",
  "rand_trait",
  "derive",
  "rand_trait",
  "errors_backtrace",
  "web_monitor",
] }
libaflmm_bolts = { path = "../../../crates/libaflmm_bolts", features = [
  "xxh3",
] }
libaflmm_targets = { path = "../../../crates/libaflmm_targets", features = [
  "sancov_pcguard_hitcounts",
  "libfuzzer",
] }
# TODO Include it only when building cc
libaflmm_cc = { path = "../../../crates/libaflmm_cc" }

clap = { version = "4.5.18", features = ["derive"] }
log = { version = "0.4.22", features = ["release_max_level_info"] }
mimalloc = { version = "0.1.43", default-features = false }
env_logger = "0.11.5"

[lib]
name = "libfuzzer_libpng"
crate-type = ["staticlib"]
