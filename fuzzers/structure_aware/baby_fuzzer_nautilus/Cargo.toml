[package]
name = "baby_fuzzer_nautilus"
version = "0.16.0"
authors = [
  "Andrea Fioraldi <andreafioraldi@gmail.com>",
  "Dominik Maier <domenukk@gmail.com>",
]
edition = "2024"

[features]
default = ["std"]
std = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
debug = true

[dependencies]
libaflmm = { path = "../../../crates/libaflmm", features = [
  "default",
  "nautilus",
] }
libaflmm_bolts = { path = "../../../crates/libaflmm_bolts" }
log = { version = "0.4.22", features = ["release_max_level_info"] }

env_logger = "0.11.7"
