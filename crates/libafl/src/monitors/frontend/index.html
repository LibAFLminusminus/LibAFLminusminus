<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LibAFL-- Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #111; color: #ccc; padding: 1.5rem; }
    h1 { font-size: 1.2rem; margin-bottom: 1rem; color: #fff; }
    .summary { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .stat { background: #1e1e1e; border: 1px solid #333; padding: 0.75rem 1.25rem; border-radius: 4px; }
    .stat-label { font-size: 0.7rem; color: #888; text-transform: uppercase; margin-bottom: 0.3rem; }
    .stat-value { font-size: 1.4rem; color: #4fc3f7; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; max-width: 1800px; }
    .chart-wrap { background: #1e1e1e; border: 1px solid #333; border-radius: 4px; padding: 1rem; }
  </style>
</head>
<body>
  <h1>LibAFL-- Monitor</h1>
  <div class="summary">
    <div class="stat"><div class="stat-label">Workers</div><div class="stat-value" id="workers">—</div></div>
    <div class="stat"><div class="stat-label">Corpus</div><div class="stat-value" id="corpus">—</div></div>
    <div class="stat"><div class="stat-label">Objectives</div><div class="stat-value" id="objectives">—</div></div>
    <div class="stat"><div class="stat-label">Execs/s</div><div class="stat-value" id="execs_per_sec">—</div></div>
    <div class="stat"><div class="stat-label">Elapsed</div><div class="stat-value" id="elapsed">—</div></div>
    <div class="stat"><div class="stat-label">Last Find</div><div class="stat-value" id="last_find">—</div></div>
    <div class="stat"><div class="stat-label">Total Execs</div><div class="stat-value" id="total_execs">—</div></div>
  </div>
  <div class="charts">
    <div class="chart-wrap">
      <canvas id="corpusObjChart"></canvas>
    </div>
    <div class="chart-wrap">
      <canvas id="execsPerSecChart"></canvas>
    </div>
  </div>
  <script>
    const corpusObjChart = new Chart(document.getElementById('corpusObjChart'), {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: 'Corpus',
            data: [],
            borderColor: 'rgb(79,195,247)',
            backgroundColor: 'rgba(79,195,247,0.08)',
            fill: true,
            tension: 0.3,
            pointRadius: 2,
            yAxisID: 'yCorpus',
          },
          {
            label: 'Objectives',
            data: [],
            borderColor: 'rgb(255,138,101)',
            backgroundColor: 'rgba(255,138,101,0.08)',
            fill: true,
            tension: 0.3,
            pointRadius: 2,
            yAxisID: 'yObj',
          },
        ]
      },
      options: {
        animation: false,
        plugins: { legend: { labels: { color: '#ccc' } } },
        scales: {
          x: {
            ticks: { color: '#888', maxTicksLimit: 10 },
            grid: { color: '#222' },
            title: { display: true, text: 'Elapsed', color: '#888' }
          },
          yCorpus: {
            position: 'left',
            beginAtZero: true,
            ticks: { color: '#4fc3f7' },
            grid: { color: '#222' },
            title: { display: true, text: 'Corpus', color: '#4fc3f7' }
          },
          yObj: {
            position: 'right',
            beginAtZero: true,
            ticks: { color: 'rgb(255,138,101)' },
            grid: { drawOnChartArea: false },
            title: { display: true, text: 'Objectives', color: 'rgb(255,138,101)' }
          },
        }
      }
    });

    function makeChart(id, label, color) {
      return new Chart(document.getElementById(id), {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            label,
            data: [],
            borderColor: color,
            backgroundColor: color.replace('rgb(', 'rgba(').replace(')', ', 0.08)'),
            fill: true,
            tension: 0.3,
            pointRadius: 2,
          }]
        },
        options: {
          animation: false,
          plugins: { legend: { labels: { color: '#ccc' } } },
          scales: {
            x: {
              ticks: { color: '#888', maxTicksLimit: 10 },
              grid: { color: '#222' },
              title: { display: true, text: 'Elapsed', color: '#888' }
            },
            y: {
              beginAtZero: true,
              ticks: { color: '#888' },
              grid: { color: '#222' },
              title: { display: true, text: label, color: '#888' }
            }
          }
        }
      });
    }

    const execsPerSecChart = makeChart('execsPerSecChart', 'Execs/s', 'rgb(129,199,132)');

    function hhmmss(secs) {
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const s = secs % 60;
      return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
    }

    function si(n) {
      if (n >= 1e12) return (n / 1e12).toFixed(1) + 'T';
      if (n >= 1e9)  return (n / 1e9).toFixed(1) + 'G';
      if (n >= 1e6)  return (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3)  return (n / 1e3).toFixed(1) + 'k';
      return String(n);
    }

    async function refresh() {
      let history;
      try {
        const resp = await fetch('/api/history');
        history = await resp.json();
      } catch (_) { return; }
      if (!history.length) return;

      const startTs = history[0].timestamp_secs;
      const latest = history[history.length - 1];
      const labels = history.map(s => hhmmss(s.timestamp_secs - startTs));

      const corpus = Math.max(...latest.stats.map(w => w.corpus));
      const objectives = latest.stats.reduce((s, w) => s + w.objective, 0);
      const workerStart = Math.min(...latest.stats.map(w => w.start_time.secs));
      const elapsed = latest.timestamp_secs - workerStart;

      let execsPerSec = '—';
      const totalExecs = latest.stats.reduce((s, w) => s + w.executions, 0);
      if (elapsed > 0) {
        execsPerSec = si(Math.round(totalExecs / elapsed)) + '/s';
      }

      const lastFoundSecs = Math.max(...latest.stats.map(w => w.last_found_time.secs));
      const lastFindAge = hhmmss(latest.timestamp_secs - lastFoundSecs);

      document.getElementById('workers').textContent = latest.stats.length;
      document.getElementById('total_execs').textContent = si(totalExecs);
      document.getElementById('corpus').textContent = corpus;
      document.getElementById('objectives').textContent = objectives;
      document.getElementById('execs_per_sec').textContent = execsPerSec;
      document.getElementById('elapsed').textContent = hhmmss(elapsed);
      document.getElementById('last_find').textContent = lastFindAge + ' ago';

      corpusObjChart.data.labels = labels;
      corpusObjChart.data.datasets[0].data = history.map(s => Math.max(...s.stats.map(w => w.corpus)));
      corpusObjChart.data.datasets[1].data = history.map(s => s.stats.reduce((a, w) => a + w.objective, 0));
      corpusObjChart.update();

      execsPerSecChart.data.labels = labels;
      execsPerSecChart.data.datasets[0].data = history.map(s => {
        const execs = s.stats.reduce((a, w) => a + w.executions, 0);
        const start = Math.min(...s.stats.map(w => w.start_time.secs));
        const dt = s.timestamp_secs - start;
        return dt > 0 ? Math.round(execs / dt) : 0;
      });
      execsPerSecChart.update();
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
