[package]
name = "libaflmm"
authors = [
  "Romain Malmain <rmalmain@pm.me>",
  "tokatoka <tokazerkje@outlook.com>",
  "Andrea Fioraldi <andreafioraldi@gmail.com>",
  "Dominik Maier <domenukk@gmail.com>",
]
description = "Slot your own fuzzers together and extend their features using Rust"
keywords = ["fuzzing", "testing", "security"]
categories = [
  "development-tools::testing",
  "emulators",
  "embedded",
  "os",
  "no-std",
]

documentation.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
features = ["document-features"]
all-features = true
rustc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = [
  "derive",
  "errors_backtrace",
  "value_bloom_feedback",
  "nautilus",
  "fork",
  "gzip",
  "libaflmm_bolts/xxh3",
  "rand_trait",
  "regex",
  "simd",
  "std",
  "remove_me",
  "nautilus",
]
document-features = ["dep:document-features"]

#! # Feature Flags
#! ### General Features

## Enables features that need rust's `std` lib to work, like print, env, ... support
std = [
  "dep:nix",
  "fastbloom",
  "libaflmm_bolts/std",
  "serde_json",
  "serde_json/std",
  "serde/std",
  "serial_test",
  "typed-builder",
]

## THIS IS A TEMPORARY DEV FEATURE FOR FAST COMPILATION
## REMOVE ME WHEN LIABFL-- REFACTORING IS DONE
remove_me = []

## `ValueBloomFeedback` checks if an observed value has already been observed, and returns `is_interesting=true` otherwise.
value_bloom_feedback = ["fastbloom", "fastbloom/serde"]

## Expose `libafl::prelude` for access without additional using directives
prelude = ["libaflmm_bolts/prelude"]

## Calculate exec/sec like AFL, using 5 second time windows
afl_exec_sec = []

## Stores the backtraces of all generated `Error`s. Good for debugging, but may come with a slight performance hit.
errors_backtrace = ["libaflmm_bolts/errors_backtrace"]

## Switches from `HashMap` to `BTreeMap` for `CorpusId`
corpus_btreemap = []

## Enables gzip compression in certain parts of the lib
gzip = ["libaflmm_bolts/gzip"]

## If set, will use the `fork()` syscall to spawn children, instead of launching a new command, if supported by the OS (has no effect on `Windows`).
fork = ["libaflmm_bolts/derive"]

## If this feature is set, `LibAFL` targets (and the fuzzer) will crash on `SIGPIPE` on unix systems.
handle_sigpipe = []

#! ## Additional Components

## Enable multi-machine support
multi_machine = ["tokio", "std", "enumflags2", "ahash/std"]

## Enables the `NaiveTokenizer` and `StacktraceObserver`
regex = ["std", "dep:regex", "dep:backtrace"]

## Intel Processor Trace
intel_pt = ["std", "dep:libaflmm_intelpt", "dep:nix"]
## Save all the Intel PT raw traces to files, use only for debug
intel_pt_export_raw = ["intel_pt", "libaflmm_intelpt/export_raw"]

#! ## LibAFL-Bolts Features

## Provide the `#[derive(SerdeAny)]` macro.
derive = [
  "libaflmm_derive",
  "libaflmm_bolts/derive",
] # provide `derive(SerdeAny) macro.

## Expose `libaflmm_bolts::cli` for easy commandline parsing of common fuzzer settings
cli = ["libaflmm_bolts/cli"]

## Enables extra commandline flags for qemu-based fuzzers in `cli`
qemu_cli = ["cli", "libaflmm_bolts/qemu_cli"]

## Enables extra commandline flags for frida-based fuzzers in `cli`
frida_cli = ["cli", "libaflmm_bolts/frida_cli"]

## If set, libaflmm_bolt's `rand` implementations will implement `rand::Rng`
rand_trait = ["libaflmm_bolts/rand_trait"]

#! ### SerdeAny features

## Grammar mutator.
nautilus = ["std", "serde_json/std", "rand_trait", "regex-syntax", "regex"]

## Python grammar support for nautilus
nautilus_py = ["nautilus", "dep:pyo3"]

## Use the best SIMD implementation by our benchmark
simd = ["libaflmm_bolts/simd", "libaflmm_bolts/wide"]

[build-dependencies]
rustversion = "1.0.22"

[dev-dependencies]
serde_json = { workspace = true, default-features = false, features = [
  "alloc",
] }
# clippy-suggested optimised byte counter
bytecount = "0.6.8"
rusty-fork = "0.3.1"

[dependencies]
libaflmm_bolts = { workspace = true, features = ["alloc"] }
libaflmm_core = { workspace = true }
libaflmm_derive = { workspace = true, default-features = true, optional = true }
libaflmm_intelpt = { workspace = true, default-features = true, optional = true }
libaflmm_targets = { workspace = true, default-features = true }

quanta = "0.12.6"
ahash = { workspace = true } # The hash function already used in hashbrown
arbitrary-int = { workspace = true }
backtrace = { workspace = true, optional = true, features = [
  "std",
] } # Used to get the stacktrace in StacktraceObserver
bitbybit = { workspace = true }
enumflags2 = { version = "0.7.10", optional = true }
fastbloom = { workspace = true, optional = true }
hashbrown = { workspace = true, features = [
  "serde",
  "default-hasher",
  "raw-entry",
], default-features = false } # A faster hashmap, nostd compatible
libm = "0.2.8"
log = { workspace = true }
meminterval = { workspace = true, features = ["serde"] }
nix = { workspace = true, optional = true, features = [
  "signal",
  "poll",
  "ptrace",
  "personality",
  "fs",
  "mman",
] }
num-traits = { workspace = true, default-features = false }
postcard = { workspace = true } # no_std compatible serde serialization format
pyo3 = { workspace = true, optional = true }
serde = { workspace = true, features = ["alloc", "derive", "rc"] }
serde_json = { workspace = true, default-features = false, features = [
  "alloc",
], optional = true }
static_assertions = { workspace = true }
humantime = "2.1"
tokio = { version = "1.40.0", optional = true, features = [
  "sync",
  "net",
  "rt",
  "io-util",
  "macros",
  "rt-multi-thread",
  "time",
] } # used for TCP Event Manager and multi-machine
tuple_list = { workspace = true }
typed-builder = { workspace = true, optional = true } # Implement the builder pattern at compiletime

regex = { workspace = true, optional = true }
regex-syntax = { version = "0.8.4", optional = true } # For nautilus

# optional-dev deps (change when target.'cfg(accessible(::std))'.test-dependencies will be stable)
serial_test = { workspace = true, optional = true, default-features = false, features = [
  "logging",
] }

# Document all features of this crate (for `cargo doc`)
document-features = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true } # For (*nix) libc

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_Memory",
  "Win32_Security",
  "Win32_System_SystemInformation",
] }
winapi = { version = "0.3", features = [
  "dbghelp",
  "minwindef",
  "winnt",
  "errhandlingapi",
  "processthreadsapi",
] }
[target.'cfg(windows)'.build-dependencies]
windows = { workspace = true }
