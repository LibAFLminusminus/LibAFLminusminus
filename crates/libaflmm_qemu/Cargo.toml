[package]
name = "libaflmm_qemu"
authors = [
  "Andrea Fioraldi <andreafioraldi@gmail.com>",
  "Romain Malmain <rmalmain@pm.me>",
]
description = "QEMU user backend library for LibAFL"
keywords = ["fuzzing", "qemu", "instrumentation"]
categories = ["development-tools::testing", "emulators", "embedded", "os"]

documentation.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
features = ["document-features", "default", "python", "x86_64", "usermode"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["asan_guest", "asan_host", "usermode", "injections"]
## Build asan for address sanitization
asan_guest = []
asan_host = []
## Use Address Sanitizer implementation written in rust (rather than the older C version)
asan_rust = []

document-features = ["dep:document-features"]

qemu_sanitizers = ["libaflmm_qemu_sys/qemu_sanitizers"]

paranoid_debug = [
  "libaflmm_qemu_sys/paranoid_debug",
] # Will perform as many checks as possible. The target will be greatly slowed down.

#! # Feature Flags
#! ### General Features
## Find injections during fuzzing
injections = ["serde_yaml", "toml"]
## Python bindings support
python = ["pyo3", "pyo3-build-config", "libaflmm_qemu_sys/python"]

#! ## The following architecture features are mutually exclusive.

## build qemu for x86_64 (default)
x86_64 = ["libaflmm_qemu_sys/x86_64", "libvharness_sys/x86_64"]
i386 = ["libaflmm_qemu_sys/i386", "libvharness_sys/i386"] # build qemu for i386
arm = ["libaflmm_qemu_sys/arm", "libvharness_sys/arm"] # build qemu for arm
aarch64 = [
  "libaflmm_qemu_sys/aarch64",
  "libvharness_sys/aarch64",
] # build qemu for aarch64
# build qemu for mips (el, use with the 'be' feature of mips be)
mips = ["libaflmm_qemu_sys/mips", "libvharness_sys/mips"]
ppc = ["libaflmm_qemu_sys/ppc", "libvharness_sys/ppc"] # build qemu for powerpc
hexagon = [
  "libaflmm_qemu_sys/hexagon",
  "libvharness_sys/hexagon",
] # build qemu for hexagon
riscv32 = [
  "libaflmm_qemu_sys/riscv32",
  "libvharness_sys/riscv32",
] # build qemu for riscv 32bit
riscv64 = [
  "libaflmm_qemu_sys/riscv64",
  "libvharness_sys/riscv64",
] # build qemu for riscv 64bit

## Big Endian mode
be = ["libaflmm_qemu_sys/be"]

## Usermode (mutually exclusive to Systemmode)
usermode = ["libaflmm_qemu_sys/usermode"]
## Systemmode (mutually exclusive to Usermode) - requires libvharness
systemmode = ["libaflmm_qemu_sys/systemmode"]

#! ## SerdeAny features

slirp = [
  "systemmode",
  "libaflmm_qemu_sys/slirp",
] # build qemu with host libslirp (for user networking)

intel_pt = ["systemmode", "x86_64", "dep:libaflmm_intelpt"]
intel_pt_export_raw = ["intel_pt", "libaflmm_intelpt/export_raw"]

nyx = ["systemmode", "x86_64", "libvharness_sys/nyx"]

# Requires the binary's build.rs to call `build_libaflmm_qemu`
shared = ["libaflmm_qemu_sys/shared"]

#! ## Internal features, don't use in normal projects
## clippy workaround
clippy = ["libaflmm_qemu_sys/clippy", "libvharness_sys/clippy"]

[dependencies]
libaflmm = { workspace = true, features = ["derive"] }
libaflmm_bolts = { workspace = true, features = ["derive"] }
libaflmm_core = { workspace = true }
libaflmm_targets = { workspace = true, default-features = true }
libaflmm_qemu_sys = { workspace = true }
libaflmm_derive = { workspace = true, default-features = true }
libaflmm_intelpt = { workspace = true, default-features = true, optional = true }

serde = { workspace = true, default-features = false, features = [
  "alloc",
] } # serialization lib
hashbrown = { workspace = true, default-features = true, features = [
  "serde",
] } # A faster hashmap, nostd compatible
num-traits = { workspace = true, default-features = true }
num_enum = { workspace = true, default-features = true }
goblin = "0.10.5"
libc = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
syscall-numbers = "4.0.3"
meminterval = { workspace = true }
thread_local = "1.1.9"
capstone = "0.14.0"
rangemap = { workspace = true }
log = { workspace = true }
object = "0.38.1"
addr2line = "0.25.1"
paste = { workspace = true }
enum-map = "2.7.3"
serde_yaml = { workspace = true, optional = true } # For parsing the injections yaml file
toml = { workspace = true, optional = true } # For parsing the injections toml file
pyo3 = { workspace = true, optional = true, features = ["multiple-pymethods"] }
typed-builder = { workspace = true }
getset = "0.1.6"
libvharness_sys = { workspace = true }

# Document all features of this crate (for `cargo doc`)
document-features = { workspace = true, optional = true }

[build-dependencies]
pyo3-build-config = { workspace = true, optional = true }
rustversion = { workspace = true }
just = { workspace = true }

[lib]
name = "libaflmm_qemu"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
