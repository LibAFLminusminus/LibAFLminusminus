[workspace]
resolver = "2"
members = [
  # LibAFLmm
  "crates/libaflmm_asan",
  "crates/libaflmm_asan/libaflmm_asan_fuzz",
  "crates/libaflmm_bolts",
  "crates/libaflmm_build",
  "crates/libaflmm_cc",
  "crates/libaflmm_core",
  "crates/libaflmm_derive",
  "crates/libaflmm_frida",
  "crates/libaflmm_intelpt",
  "crates/libaflmm_nyx",
  "crates/libaflmm_qemu",
  "crates/libaflmm_qemu/libaflmm_qemu_build",
  "crates/libaflmm_qemu/libaflmm_qemu_runner",
  "crates/libaflmm_qemu/libaflmm_qemu_sys",
  "crates/libaflmm_qemu/libvharness_sys",
  "crates/libaflmm_targets",
  "crates/libaflmm",

  # utils
  "utils/build_and_test_fuzzers",
  "utils/ci_runner",
  "utils/ci_splitter",
  "utils/drcov_utils",
  "utils/libaflmm_benches",
  "utils/find_llvm_config",
  "utils/libaflmm_repo_tools",

  # linters
  "mmlint/generics_reorder",
  "mmlint/args_reorder",
  "mmlint/use_after_mod",

  # bindings
  "bindings/pylibaflmm",
]

default-members = [
  "crates/libaflmm_bolts",
  "crates/libaflmm_cc",
  "crates/libaflmm_derive",
  "crates/libaflmm_targets",
  "crates/libaflmm",
]

exclude = [
  "docs",
  "fuzzers",
  "scripts",
  "utils/gdb_qemu",
  "utils/multi_machine_generator",
  "utils/noaslr",
]

[workspace.package]
documentation = "https://docs.rs/libaflmm"
edition = "2024"
version = "0.16.0"
license = "MPL-2.0"
repository = "https://github.com/LibAFLminusminus/LibAFLminusminus"
readme = "./README.md"
rust-version = "1.89"

[workspace.dependencies]
# Internal deps
libaflmm = { path = "./crates/libaflmm", version = "0.16.0", default-features = false }
libaflmm_bolts = { path = "./crates/libaflmm_bolts", version = "0.16.0", default-features = false }
libaflmm_build = { path = "./crates/libaflmm_build", version = "0.16.0", default-features = false }
libaflmm_cc = { path = "./crates/libaflmm_cc", version = "0.16.0", default-features = false }
libaflmm_core = { path = "./crates/libaflmm_core", version = "0.16.0", default-features = false }
libaflmm_derive = { path = "./crates/libaflmm_derive", version = "0.16.0", default-features = false }
libaflmm_frida = { path = "./crates/libaflmm_frida", version = "0.16.0", default-features = false }
libaflmm_intelpt = { path = "./crates/libaflmm_intelpt", version = "0.16.0", default-features = false }
libaflmm_nyx = { path = "./crates/libaflmm_nyx", version = "0.16.0", default-features = false }
libaflmm_qemu = { path = "./crates/libaflmm_qemu", version = "0.16.0", default-features = false }
libaflmm_qemu_build = { path = "./crates/libaflmm_qemu/libaflmm_qemu_build", version = "0.16.0", default-features = false }
libaflmm_qemu_sys = { path = "./crates/libaflmm_qemu/libaflmm_qemu_sys", version = "0.16.0", default-features = false }
libaflmm_targets = { path = "./crates/libaflmm_targets", version = "0.16.0", default-features = false }

# Utils
build_and_test_fuzzers = { path = "./utils/build_and_test_fuzzers", version = "0.16.0", default-features = false }
drcov_utils = { path = "./utils/drcov_utils", version = "0.16.0", default-features = false }
libaflmm_benches = { path = "./utils/libaflmm_benches", version = "0.16.0", default-features = false }

# External deps
ahash = { version = "0.8.12", default-features = false } # The hash function already used in hashbrown
arbitrary-int = "2.1.1" # arbitrary sized integers, useful in combination with bitfields (bitbybit crate)
backtrace = { version = "0.3.76", default-features = false } # Used to get the stacktrace in StacktraceObserver
bindgen = "0.72.1"
bitbybit = "2.0.0" # bitfields, use this for bit fields and bit enums
clap = "4.6.1"
cc = "1.2.63"
cmake = "0.1.58"
ctor = "1.0.7"
delegate = "0.13.5"
document-features = "0.2.12"
erased-serde = { version = "0.4.10", default-features = false } # erased serde
glob = "0.3"
hashbrown = { version = "0.17.1", default-features = false } # A faster hashmap, nostd compatible
just = "1.52.0"
libc = "0.2.186" # For (*nix) libc
libipt = { version = "0.4.0", features = ["libipt_master"] }
libvharness_sys = { path = "./crates/libaflmm_qemu/libvharness_sys", version = "0.16.0", default-features = false }
log = "0.4.32"
meminterval = "0.4.2"
mimalloc = { version = "0.1.52", default-features = false }
nix = { version = "0.31.3", default-features = false }
num_enum = { version = "0.7.6", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
paste = "1.0.15"
postcard = { version = "1.1.3", features = [
  "alloc",
], default-features = false } # no_std compatible serde serialization format
pyo3 = { version = "0.28.3", features = ["auto-initialize"] }
pyo3-build-config = "0.28.3"
pyo3-log = "0.13.3"
rand_core = "0.10.1"
rangemap = "1.7.1"
regex = "1.12.4"
rustversion = "1.0.22"
serde = { version = "1.0.228", default-features = false } # serialization lib
serde_json = { version = "1.0.150", default-features = false }
serde_yaml = { version = "0.9.34" } # For parsing the injections yaml file
serial_test = { version = "3.5.0", default-features = false }
static_assertions = "1.1.0"
strum = "0.28.0"
tempfile = "3.27.0"
thiserror = { version = "2.0.18", default-features = false }
tokio = { version = "1.52.3", default-features = false }
toml = "1.1.2" # For parsing the injections toml file
tuple_list = { version = "0.1.3" }
typed-builder = "0.23.2" # Implement the builder pattern at compiletime
typeid = "1.0.3" # Safe type_eq that doesn't rely on std specialization
uuid = { version = "1.23.3", features = ["serde", "v4"] }
which = "8.0.3"
windows = "0.62.2"
windows-core = "0.62.2"

[workspace.lints.rust]
# Deny
warnings = { level = "deny", priority = -1 }

# Forbid
unexpected_cfgs = "forbid"

# Allow
incomplete_features = "allow"
# ambiguous_glob_reexports = "allow"


[workspace.lints.clippy]
# Deny
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo_common_metadata = "deny"

alloc_instead_of_core = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"

# Warn
cargo = { level = "warn", priority = -1 }

# Allow
cast_possible_truncation = "allow"
comparison_chain = "allow"          # This lint makes **ZERO** sense
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"   # TODO: turn into `warn` when working
negative_feature_names = "allow"    # TODO: turn into 'warn' when working
ptr_as_ptr = "allow"
similar_names = "allow"
struct_field_names = "allow"        # ????
too_many_lines = "allow"
type_repetition_in_bounds = "allow"
unreadable_literal = "allow"
unsafe_derive_deserialize = "allow"
used_underscore_binding = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"

[workspace.metadata.dylint]
libraries = [
  { path = "./mmlint", pattern = "generics_reorder" },
  { path = "./mmlint", pattern = "args_reorder" },
  { path = "./mmlint", pattern = "use_after_mod" },
]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true
