name: setup-rust
description: Setup Rust

inputs:
  toolchain:
    description: Choose the toolchain version (stable, nightly, specific version, etc.)
    required: false
    default: stable
  components:
    description: Choose the toolchain components to integrate (clippy, rustfmt, etc.)
    required: false
    default: clippy,rustfmt
  cache-key:
    description: Shared cache key
    required: true
  save-cache:
    description: write to the cache
    required: false
    default: true
  cargo-install:
    description: Comma-separated list of cargo binaries to install (e.g. cargo-hack,cargo-nextest).
    required: false
    default: ""
  cargo-install-git:
    description: Comma-separated list of git repos to install via `cargo install --git`.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Cargo defaults
      shell: bash
      run: |
        echo "CARGO_TERM_COLOR=always" >> $GITHUB_ENV
        echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $GITHUB_ENV
    - name: Install Rust toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
      run: |
        CARGO_BIN="${CARGO_HOME:-$HOME/.cargo}/bin"

        # install rustup if not already present.
        if [[ ! -x "$CARGO_BIN/rustup" ]]; then
          curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --default-toolchain none
        fi

        # make rustup available for the commands below.
        export PATH="$CARGO_BIN:$PATH"

        rustup toolchain install "$TOOLCHAIN" --no-self-update
        for component in ${COMPONENTS//,/ }; do
          rustup component add --toolchain "$TOOLCHAIN" "$component"
        done

        # set the rustup toolchain through the env, using the toolchain directory.
        TOOLCHAIN_FULL=$(rustup toolchain list 2>/dev/null \
          | grep "^${TOOLCHAIN}-" | awk '{print $1}' | head -1)
        TOOLCHAIN_BIN="$HOME/.rustup/toolchains/${TOOLCHAIN_FULL}/bin"
        {
          echo "$TOOLCHAIN_BIN"  # direct toolchain binaries (cargo, rustc, …)
          echo "$CARGO_BIN"      # rustup itself + cargo-installed tools
        } >> "$GITHUB_PATH"
        export PATH="$TOOLCHAIN_BIN:$PATH"

        echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

    - name: Use mold linker if available
      shell: bash
      run: |
        if command -v mold &>/dev/null; then
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
        fi

    - name: Install Just
      uses: extractions/setup-just@v4

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache }}
        cache-all-crates: true

    - name: Install cargo binaries
      if: inputs.cargo-install != ''
      shell: bash
      env:
        BINARIES: ${{ inputs.cargo-install }}
      run: |
        for bin in $(echo "$BINARIES" | tr ',' ' '); do
          command -v "$bin" &>/dev/null || cargo install --locked "$bin"
        done

    - name: Install cargo binaries from git
      if: inputs.cargo-install-git != ''
      shell: bash
      env:
        REPOS: ${{ inputs.cargo-install-git }}
      run: |
        for repo in $(echo "$REPOS" | tr ',' ' '); do
          command -v "$(basename "$repo" .git)" &>/dev/null || cargo install --locked --git "$repo"
        done
