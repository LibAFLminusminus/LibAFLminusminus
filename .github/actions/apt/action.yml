name: apt
description: Base packages for Linux jobs

inputs:
  qemu:
    description: Install QEMU dependencies
    required: false
    default: false
  aflplusplus:
    description: Build and install AFLplusplus from the submodule
    required: false
    default: false

runs:
  using: composite
  steps:
    - name: Enable apt source repositories
      shell: bash
      run: |
        if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
        fi

        if [ -f /etc/apt/sources.list ]; then
          sudo sed -i 's/^# deb-src/deb-src/' /etc/apt/sources.list
        fi

        sudo apt-get update

    - name: Cache apt archives
      uses: actions/cache@v5
      with:
        path: /var/cache/apt/archives/*.deb
        key: apt-ubuntu-24.04-${{ inputs.qemu == 'true' && 'qemu' || 'base' }}-v1

    - name: Install base packages
      shell: bash
      run: |
        packages=(
          curl lsb-release wget software-properties-common gnupg unzip
          shellcheck libc6-dev gcc g++ build-essential libfile-mimeinfo-perl
          python3-pip cmake python3 libpython3-dev mold yq libasan8
          python3-dev automake flex bison
          clang llvm llvm-dev lld
        )

        sudo apt-get install -y --no-install-recommends "${packages[@]}"

    - name: Install QEMU build dependencies
      if: ${{ inputs.qemu == 'true' }}
      shell: bash
      run: |
        sudo apt-get build-dep -y qemu

    - name: Install QEMU runtime packages
      if: ${{ inputs.qemu == 'true' }}
      shell: bash
      run: |
        packages=(
          qemu-utils
          gcc-arm-none-eabi
          libnewlib-arm-none-eabi
        )

        sudo apt-get install -y --no-install-recommends "${packages[@]}"

    - name: Build and install AFLplusplus
      if: ${{ inputs.aflplusplus == 'true' }}
      shell: bash
      run: |
        git -C "$GITHUB_WORKSPACE" submodule update --init --checkout --force AFLplusplus
        make -C "$GITHUB_WORKSPACE/AFLplusplus"
        sudo make -C "$GITHUB_WORKSPACE/AFLplusplus" install
