name: "CI - Book"
on:
  workflow_call: {}

jobs:
  book:
    runs-on: ubuntu-latest
    env:
      RUN_ON_CI: 1
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/apt
      - name: Install vale
        shell: bash
        run: |
          url=$(curl -fsSL https://api.github.com/repos/errata-ai/vale/releases/latest \
            | grep -o 'https://[^"]*Linux_64-bit\.tar\.gz' | head -1)
          curl -fsSL "$url" | sudo tar -xz -C /usr/local/bin vale
      - name: Install drawio
        shell: bash
        run: |
          url=$(curl -fsSL https://api.github.com/repos/jgraph/drawio-desktop/releases/latest \
            | grep -o 'https://[^"]*amd64[^"]*\.deb' | head -1)
          curl -fsSL "$url" -o /tmp/drawio.deb
          sudo apt-get install -y /tmp/drawio.deb
          sudo apt-get install -y --no-install-recommends xvfb
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: book
          cargo-install: mdbook,lychee
          cargo-install-git: https://github.com/QBayLogic/mdbook-drawio
      - name: Build book
        shell: bash
        run: |
          cd book
          xvfb-run -a mdbook build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/book

  deploy:
    needs: book
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
       name: github-pages
       url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
