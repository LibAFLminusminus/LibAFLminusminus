name: build and test
permissions:
  contents: read

on:
  push:
    branches: [main, "pr/**"]
  pull_request:
    branches: [main]
    types: ["labeled", "opened", "synchronize", "reopened"]
  workflow_dispatch:
  merge_group:
  schedule:
    - cron: "0 6 * * 1" # Re-run every mondays at 06:00 UTC in case a new lint break everything
env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  MAIN_LLVM_VERSION: 22

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","linux"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/apt
        with:
          qemu: true
      - uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.MAIN_LLVM_VERSION }}
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ubuntu
          cache: ${{ vars.RUNS_ON != '' }}
      - uses: ./.github/actions/cache-qemu-nyx
      - name: Check for blobs
        run: ./scripts/check_for_blobs.sh
      - name: Check for conflicting dependency versions
        run: cargo tree -d --workspace
      - name: Build workspace (Debug)
        run: cargo build --workspace --all-targets --exclude libaflmm_asan_libc --exclude libaflmm_frida --exclude args_reorder --exclude generics_reorder --exclude use_after_mod
      - name: Test examples
        run: cargo test --workspace --all-targets --exclude libaflmm_asan --exclude libaflmm_asan_fuzz --exclude libaflmm_asan_libc --exclude libaflmm_frida --exclude args_reorder --exclude generics_reorder --exclude use_after_mod --examples
      - name: Build docs
        run: ./scripts/doc_all.py
      - name: Run tests serially
        run: cargo test -- --test-threads 1
      - name: Check sancov pcguard edges
        run: cargo check --features=sancov_pcguard_edges
      - name: Shellcheck
        run: shellcheck ./scripts/*.sh

  ubuntu-miri:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","linux"]') }}
    if: contains( github.event.pull_request.labels.*.name, 'pre-release')
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/apt
      - uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.MAIN_LLVM_VERSION }}
      - uses: ./.github/actions/setup-rust
        with:
          components: miri
          cache-key: ubuntu-miri
          cache: ${{ vars.RUNS_ON != '' }}
      - name: Run miri tests
        run: RUST_BACKTRACE=1 MIRIFLAGS="-Zmiri-disable-isolation" cargo miri test

  ubuntu-clippy:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","linux"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/apt
        with:
          qemu: true
      - uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.MAIN_LLVM_VERSION }}
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ubuntu
          cache: ${{ vars.RUNS_ON != '' }}
      - uses: ./.github/actions/cache-qemu-nyx
      - name: Run clippy
        run: ./scripts/clippy.sh

  ubuntu-check:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","linux"]') }}
    strategy:
      matrix:
        # check CI_INSTANCES if you change that to match
        instance_idx: ["0", "1"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/apt
        with:
          qemu: true
      - uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.MAIN_LLVM_VERSION }}
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          cache-key: ubuntu
          cache: ${{ vars.RUNS_ON != '' }}
      - uses: ./.github/actions/cache-qemu-nyx
      - name: Check each feature
        env:
          # check instance_idx if you change that to match
          CI_INSTANCES: 4
          LLVM_VERSION: ${{ env.MAIN_LLVM_VERSION }}
        run: cargo run --manifest-path utils/ci_splitter/Cargo.toml -- ${{ matrix.instance_idx }}

  cargo-fmt:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","linux"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/apt
      - uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.MAIN_LLVM_VERSION }}
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ubuntu
          cache: ${{ vars.RUNS_ON != '' }}
      - name: Installing python3 black
        run: command -v black &>/dev/null || pipx install black
      - name: Check formatting
        run: ./scripts/fmt_all.sh check

  check-md-links:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","linux"]') }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install Chromium
        shell: bash
        run: |
          APT_LOCK=/var/lock/github-apt.lock
          cache_age=$(( $(date +%s) - $(stat -c %Y /var/cache/apt/pkgcache.bin 2>/dev/null || echo 0) ))
          if [ ! -f /var/cache/apt/pkgcache.bin ] || [ "$cache_age" -gt 3600 ]; then
            sudo flock --timeout 300 "$APT_LOCK" apt-get update
          fi
          dpkg -s chromium &>/dev/null || \
            sudo flock --timeout 300 "$APT_LOCK" \
              apt-get install -y --no-install-recommends chromium
      - name: Run linkspector
        uses: umbrelladocs/action-linkspector@v1
        with:
          fail_on_error: "true"
          config_file: ".github/.linkspector.yml"

  fuzzers:
    name: Testing ${{ matrix.fuzzer }}
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","linux"]') }}
    strategy:
      fail-fast: false
      matrix:
        fuzzer:
          # Tutorial
          - baby/baby_cmplog
          - baby/baby_forkserver
          - baby/baby_inprocess
          - inprocess/sqlite
    env:
      PROFILE: dev # build in debug mode to speed up the tests
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/apt
      - uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.MAIN_LLVM_VERSION }}
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ubuntu
          cache: ${{ vars.RUNS_ON != '' }}
      - name: Run test
        shell: bash
        run: |
          cd fuzzers/${{ matrix.fuzzer }}
          just test

  fuzzers-qemu:
    name: Testing ${{ matrix.fuzzer }} (QEMU)
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","linux"]') }}
    strategy:
      fail-fast: false
      matrix:
        fuzzer:
          # Tutorial
          - baby/baby_nyx

          # Full-system
          - full_system/qemu_baremetal
    env:
      PROFILE: dev # build in debug mode to speed up the tests
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/apt
        with:
          qemu: true
      - uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.MAIN_LLVM_VERSION }}
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ubuntu
          cache: ${{ vars.RUNS_ON != '' }}
      - uses: ./.github/actions/cache-qemu-nyx
        with:
          target-dir: fuzzers/${{ matrix.fuzzer }}/target/debug
      - name: Run test
        shell: bash
        run: |
          cd fuzzers/${{ matrix.fuzzer }}
          just test
