name: build and test
permissions:
  contents: read

on:
  push:
    branches: [main, "pr/**"]
  pull_request:
    branches: [main]
    types: ["labeled", "opened", "synchronize", "reopened"]
  workflow_dispatch:
  merge_group:
env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  MAIN_LLVM_VERSION: 22

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/apt-base
      - uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.MAIN_LLVM_VERSION }}
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ubuntu
      - name: Check for blobs
        run: ./scripts/check_for_blobs.sh
      - name: Check for conflicting dependency versions
        run: cargo tree -d --workspace
      - name: Build LibAFLmm (Debug)
        run: cargo build
      - name: Build docs
        run: ./scripts/doc_all.py
      - name: Run tests serially
        run: cargo test -- --test-threads 1

  ubuntu-miri:
    runs-on: ubuntu-24.04
    if: contains( github.event.pull_request.labels.*.name, 'pre-release')
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/apt-base
      - uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.MAIN_LLVM_VERSION }}
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          cache-key: ubuntu-miri
      - name: Run miri tests
        run: RUST_BACKTRACE=1 MIRIFLAGS="-Zmiri-disable-isolation" cargo miri test
